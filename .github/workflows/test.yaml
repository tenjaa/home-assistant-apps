name: Test tiny-TRMNL

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tiny-TRMNL tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiny-trmnl
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: jdx/mise-action@v5.1.1
      with:
        working_directory: tiny-trmnl
    - run: npm ci
    - run: npx playwright install --with-deps firefox
    - run: npm test
    - name: Upload visual test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: visual-test-results
        path: |
          tiny-trmnl/test-results/
          tiny-trmnl/playwright-report/
        retention-days: 7
